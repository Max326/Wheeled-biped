[env:disco_f411ve]
; Keep the version lock to fix the SimpleFOC timer issue
platform = ststm32@17.0.0

; Use the native Discovery board profile
board = disco_f411ve
framework = arduino

monitor_speed = 115200

lib_deps = 
    https://github.com/simplefoc/Arduino-FOC.git#dev